<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japan Rail Explorer · Tokio</title>
  <meta name="description" content="Mapa interactivo de las líneas de tren y metro de Tokio: estaciones, trenes y datos curiosos.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%2380C241' stroke-width='6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Panel de exploración">
      <header class="brand">
        <a href="#/" class="brand-link" aria-label="Inicio">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <span class="brand-title">Japan Rail Explorer</span>
            <span class="brand-sub">東京 · Tokio</span>
          </span>
        </a>
      </header>

      <div class="search" role="search">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Busca una estación, línea o tren…" aria-label="Buscar"
               aria-controls="search-results" aria-expanded="false">
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </div>

      <main id="panel" class="panel" tabindex="-1">
        <p class="loading">Cargando la red…</p>
      </main>

      <footer class="credits">
        Trazados y estaciones © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL) ·
        Mapa base © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>
      </footer>
    </aside>

    <div id="map" class="map" aria-label="Mapa de la red"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
